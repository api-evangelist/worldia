identifier_conventions:
  style: IRI
  examples:
    - '/channels/{code} — e.g. /channels/B2C-WO (business code, not a surrogate id)'
    - '/locations/{hierarchy} — e.g. /locations/eu, /locations/io/re/saint-paul/saint-gilles'
    - '/templates/{integer} — e.g. /templates/2394'
    - '/themes/{slug} — e.g. /themes/smart_budget'
  blank_nodes: >-
    Embedded value objects (e.g. a Location's coords) receive skolem IRIs of the form
    /.well-known/genid/{20-hex}, an RDF blank-node identifier emitted by API Platform.
  note: >-
    Trip additionally carries both `id` and `idHashed`, plus a `key` and a `hubspotId`,
    indicating an externally-safe identifier distinct from the internal one and a CRM join
    to HubSpot.

