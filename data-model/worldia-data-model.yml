source: json-ld/ (16 JSON-LD context documents fetched from https://api.worldia.com/contexts/{Type})
name: Worldia Data Model
description: >-
  Entity-relationship graph of the Worldia API, derived from the sixteen JSON-LD context
  documents saved verbatim in json-ld/. Each context declares its type's property names
  against the vocabulary IRI https://api.worldia.com/docs.jsonld#, and marks a property as
  a reference to another resource by giving it "@type": "@id". Those @id-typed properties
  are the only relationship evidence Worldia publishes, and they are what the relationships
  below are built from.
derivation_method: >-
  A property declared as a plain string mapping (e.g. "stars": "Accommodation/stars") is a
  scalar attribute. A property declared as an object with "@type": "@id" (e.g. "customer":
  {"@id": "Trip/customer", "@type": "@id"}) is an IRI reference to another resource. The
  JSON-LD context does not state the TARGET type or the cardinality of a reference, so
  target and cardinality below are inferred from the property name and from IRI shapes
  actually observed in live responses (for example hydra:member entries returning
  "channel": "/channels/B2C-WO"). Where the target could not be established from evidence
  it is recorded as unknown rather than guessed, and confidence is marked accordingly.
limitations:
  - >-
    Context documents carry no datatypes, no required/optional flags, no cardinality and no
    range constraints. This graph therefore records which entities reference which, not the
    shape of the values.
  - >-
    Type coverage is evidence-led, not exhaustive. Sixteen types were confirmed to resolve
    at /contexts/{Type}; types reachable only behind authentication may exist and would not
    appear here. /contexts/Inspiration and /contexts/Product both return 404, even though
    /inspirations is a live collection — inspirations are served as Template resources
    (their members carry "@id": "/templates/2394"), which is itself a finding: the
    collection name and the resource type differ.
  - 'No subway/ render exists for this provider.'

