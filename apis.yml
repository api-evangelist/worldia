apis:
- name: Worldia API
  description: Worldia production REST API. An API Platform (Symfony) deployment that content-negotiates application/vnd.worldia+json, application/ld+json
    (Hydra) and application/problem+json. A subset of collections — channels, locations, themes, accommodations, inspirations, airports — is readable
    anonymously; trip, customer, template and payment surfaces require a bearer JWT. Channel-scoped collections require an X-Channel header naming
    a registered distribution channel. No OpenAPI, GraphQL SDL or public reference is published; the JSON-LD contexts at /contexts/{Type} are
    the only machine-readable description of the model.
  humanURL: https://corp.worldia.com/
  baseURL: https://api.worldia.com
