exhaustion_note: >-
  No 429 was induced. This pass deliberately did not attempt to find the limit by flooding
  the API — probing a live production travel platform until it breaks is not a measurement
  this pipeline takes.
finding: >-
  limit_count is 0 as an honest zero: nothing is published and nothing is signaled. An agent
  calling this API cannot know its budget in advance and cannot learn it at runtime either —
  there is no header to read and no documented backoff contract. If a limit exists it is
  enforced silently, which is the worst case for an autonomous caller: it will discover the
  ceiling only by hitting it, with no Retry-After to tell it how long to wait.
recommendation_to_provider: >-
  Emitting RateLimit and RateLimit-Policy headers costs nothing at the edge Worldia already
  runs (Caddy with a Souin cache in front of the API) and would give partner integrations a
  runtime signal they currently lack.
