ownership:
  verdict: not-first-party
  summary: 'The only 200 in this probe is on careers.worldia.com, and it is not Worldia''s document. careers.worldia.com
    is a hosted Teamtailor careers site running on a Worldia subdomain: its assets load from assets-aws.teamtailor-cdn.com,
    and the api-catalog''s own `service-doc` link points at https://docs.teamtailor.com/. The linkset
    describes Teamtailor''s job-feed endpoints (careers.worldia.com/jobs.json as application/feed+json
    and /jobs.md as text/markdown), and the accompanying llms.txt is the Teamtailor careers-site template
    listing open positions. Both are platform features of the applicant tracking system, emitted for every
    Teamtailor customer; neither was authored by Worldia and neither describes the Worldia API.'
  consequence: No WellKnown, APICatalog, SecurityTxt or LLMsTxt pointer is wired to these files in apis.yml.
    Crediting Worldia's API posture with its ATS vendor's discovery document would be exactly the vendor-misattribution
    error this pipeline exists to avoid. The files are saved because the probe is real and the finding
    is worth keeping — a reader looking at careers.worldia.com/.well-known/api-catalog should be able
    to see why it was not counted.
first_party_findings:
  security_txt: none
  api_catalog: none
  openid_configuration: none
  oauth_authorization_server: none
  ai_plugin: none
  agent_card: none
  note: Worldia serves no /.well-known/ document of its own on any host. Note separately that api.worldia.com
    DOES mint skolem identifiers under /.well-known/genid/{hash} inside JSON-LD response bodies (an RDF
    blank-node convention emitted by API Platform); that is a value-object identifier appearing in payloads,
    not a discovery document served at a well-known path, and it is not counted here.
